		# These counter lists are consulted BEFORE ArmyPriority, so whatever leads them is what
		# the vehicle queue actually builds. AntiInfantryUnits led with ftrk at 600 credits,
		# which is precisely why the queue produced flak trucks all match while the treasury
		# held 200,000. Both lists now lead with the heaviest thing that does the job, and both
		# draw on every faction now that the commander is not confined to one.
		AntiArmorUnits: qtnk, 4tnk, ttnk, ctnk, 3tnk, v2rl, dtrk
