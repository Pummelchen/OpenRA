		# Every faction and every unlocked unit, ordered by what it is worth rather than by
		# which country it came from. The commander now holds all faction prerequisites, so
		# Soviet and Allied hardware sit in one list.
		#
		# The ordering is deliberate and it addresses a measured defect: the vehicle queue was
		# producing 600-credit flak trucks while 200,000 credits sat in the bank, because the
		# cheap thing came first in this list. Expensive units both spend the surplus and win
		# the fight, so the heavy armour leads.
		#
		# warriorant is here on its numbers, not for novelty: 300 credits for 12,500 hit
		# points, against a Mammoth at 2,000 for a fraction of that, out of the infantry queue
		# this commander has been leaving idle.
		ArmyPriority: warriorant, fireant, 4tnk, qtnk, ttnk, ctnk, 3tnk, shok, 2tnk, dtrk, v2rl, arty, mig, hind, 1tnk, e3, e1, jeep, scoutant
