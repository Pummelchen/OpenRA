Player:
	# Every bot - the coalition commander and the scripted opponents alike - opens with this much
	# capital. Bot-versus-bot benchmarks therefore stay a like-for-like comparison; against a human
	# it is an advantage and is reported as one.
	# EVERY faction unlocked for the coalition bot.
	#
	# Buildability in this mod is gated by faction tokens - a Soviet player holds
	# structures.soviet and so may build Soviet things, and cannot build Allied ones. These
	# traits hand the bot all of them at once, so it may build anything in the game from any
	# country, secret and special units included, whatever faction it happens to be playing.
	#
	# Granted on the player actor rather than through DeveloperMode.AllTech, which is a cheat
	# switch tied to the lobby: this is a permanent property of the bot, it still has to build
	# the prerequisite STRUCTURES for anything it wants, and it still pays full price. What it
	# removes is only the accident of which country it was assigned.
	# 46 tokens, generated from every ProvidesPrerequisite in the mod rules.
	ProvidesPrerequisite@allfactionsaircraftallies:
		RequiresCondition: enable-ai
		Prerequisite: aircraft.allies
