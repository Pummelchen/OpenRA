	# The campaign and secret units. Everything gated behind "~disabled" is hidden from skirmish
	# because nothing in the mod ever provides that prerequisite - the giant ants from "It Came From
	# Red Alert", the Hind, and the campaign variants of FACT and TRUK. Providing it to the bot and
	# to nobody else unlocks exactly that set.
	#
	# The ants are the reason to be careful with this: WarriorAnt costs 300 credits and carries
	# 12,500 hit points, against a Heavy Tank's ~1,150 for ~400. They are buildable from the infantry
	# queue, which is the queue this commander has been leaving idle all along.
	ProvidesPrerequisite@allfactionsdisabled:
		RequiresCondition: enable-ai
		Prerequisite: disabled
