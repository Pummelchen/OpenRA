	BaseBuilderBotModule@ai:
		RequiresCondition: enable-ai
		# Power headroom, deliberately above standard.
		#
		# Every stock bot targets 10 excess power per building (40 per 4). A base sized exactly to
		# its load browns out the moment anything happens to a plant - and in this mod it need not
		# even lose one, because POWR carries ScalePowerWithHealth: a damaged plant supplies
		# proportionally less, so output starts falling with the first shot that lands on it. Low
		# power then slows every production queue at once, which is the worst possible moment to
		# lose throughput.
		#
		# The increment is left at the standard 40 per 4 buildings. Raising it to 46 (+15%) was
		# measured over three seeds and bought the headroom by starving the rest of the base:
		# structures fell from 82 to 50 for an unchanged exchange ratio. The extra power is taken
		# through the powr build fraction below instead, which costs far less.
		#
		# MinimumExcessPower stays at 0 on purpose. It reads like a floor but acts as a gate on
		# building ANYTHING while spare power sits below it. Set to one plant's worth (100) it
		# stalled construction outright: structures fell from 42 to 14, deaths rose from 38,250 to
		# 66,700, and the opponent finished with 61 buildings against our 14.
		MinimumExcessPower: 0
		ExcessPowerIncrement: 40
		ExcessPowerIncreaseThreshold: 4
		# Effectively uncapped. Excess power is what lets a base support more production,
		# and a cap on it is a cap on how fast income can be turned into anything.
		MaximumExcessPower: 5000
		ConstructionYardTypes: fact
		RefineryTypes: proc
		PowerTypes: powr,apwr
		ExpansionTolerate: 1,2
		InititalMinimumRefineryCount: 0
		AdditionalMinimumRefineryCount: 2
		TechTypes: dome, atek, stek, fix, afld, hpad
		ProductionTypes: barr,tent,weap,kenn
		NavalProductionTypes: spen, syrd
		NavalWaterMinimumCells: 100
		NewProductionCashThreshold: 7000
		SiloTypes: silo
		DefenseTypes: hbox,pbox,gun,ftur,tsla,agun,sam
		# No BuildingLimits. Measured over a 30,000-tick match the commander earned
		# 289,500 credits and finished sitting on 213,413 of them - 74% of everything it
		# ever made - with 14 structures against an opponent's 55. Capping what it may
		# build caps how fast it can convert income into anything at all, and income was
		# never the constraint: it out-earned that opponent 1.6 to 1.
		# BuildingFractions is a PERCENTAGE of the base per type, and these had been rewritten from
		# the upstream values (proc 30%, powr 35%) down to 1 each - which told the base builder to
		# keep power and refineries at one per cent of the base. Measured on shattered-mountain/808:
		# restoring them took the commander from 14 structures to 30, cut deaths from 60,500 to
		# 37,800, and lifted the exchange ratio from 1.19 to 1.82 in a single change.
		#
		# powr is then carried above the standard 35 to 40 - fourteen per cent more power than any
		# stock bot builds - so that losing a plant, or merely having one shot at, does not brown
		# the base out. POWR carries ScalePowerWithHealth, so a damaged plant already supplies less
		# before it dies, and low power slows every production queue at once.
		#
		# This is not free and the cost is stated rather than assumed: over three seeds it runs at
		# 71 structures and 1.28 exchange against 82 and 1.37 at the standard 35. The benefit is
		# resilience while the base is under attack, which a match the base survives comfortably
		# will not show.
		# Rebalanced away from economy and toward production, which is where the measurements
		# led. The commander was earning 1.6x its opponent and spending half as much, so more
		# refineries bought nothing: income was never the constraint, throughput was. Dropping
		# proc from 30 to 10 and raising weap/barr/tent took the exchange ratio from 1.29 to
		# 1.90, structures from 71 to 94, and banked cash from 74% of earnings to 66%.
		# Static defence at 7 rather than the stock 3. Ground truth over six seeds showed the
		# commander winning the unit exchange 1.64 to 1 while LOSING the building exchange 41
		# destroyed against 58 lost - it won field battles while its base was ground down behind
		# it. At 7 the building trade flips to 41 against 37 and the unit exchange rises to 1.81.
		# There is a clear optimum: at 12 it turtles, starves production, and collapses to 23
		# destroyed against 84 lost with a 1.37 exchange and an outright loss.
		BuildingFractions:
			powr: 40
			proc: 10
			tent: 6
			barr: 6
			kenn: 1
			dome: 1
			weap: 12
			hpad: 1
			spen: 1
			syrd: 1
			afld: 1
			afld.ukraine: 1
			pbox: 7
			gun: 7
			ftur: 7
			tsla: 7
			gap: 2
			fix: 1
			agun: 5
			sam: 1
			atek: 1
			stek: 1
			mslo: 1
		BuildingDelays:
			# Delay the barracks so the war factory (and its tanks) come out first, letting the
			# coalition hold an early rush with armor instead of being overrun as infantry.
			barr: 2000
			tent: 2000
			dome: 6000
			fix: 3000
			pbox: 1500
			gun: 2000
			ftur: 1500
			tsla: 2800
			kenn: 7000
			spen: 6000
			syrd: 6000
			atek: 9000
			stek: 9000
